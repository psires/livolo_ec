[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "livolo-ec-daemon"
version = "0.12"
description = "Raspberry Pi MQTT daemon for the Livolo EC UART v3 adapter"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5,<4", "aiohttp>=3.12.15,<4"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1,<3"]
update = ["cryptography>=46.0.3,<47"]

[project.scripts]
livolod = "livolod.__main__:main"
livolod-firmware = "livolod.firmware_update:main"

[tool.setuptools.packages.find]
include = ["livolod*"]

[tool.setuptools.package-data]
livolod = ["static/*.html", "static/*.css", "static/*.js"]
