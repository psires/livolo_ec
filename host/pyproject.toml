[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "livolo-ec-daemon"
version = "0.2"
description = "Raspberry Pi MQTT daemon for the Livolo EC UART v3 adapter"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5,<4", "paho-mqtt>=2.1,<3"]

[project.optional-dependencies]
update = ["cryptography>=46.0.3,<47"]

[project.scripts]
livolod = "livolod.__main__:main"
livolod-firmware = "livolod.firmware_update:main"

[tool.setuptools.packages.find]
include = ["livolod*"]

[tool.setuptools.package-data]
livolod = ["static/*.html", "static/*.css", "static/*.js"]
