# Install at /etc/nginx/sites-available/livolod on development Pi 10.1.1.21.
# Included by nginx's http block. Keep these public address checks in sync.
map $http_host $livolod_allowed_host {
    default 0;
    "10.1.1.21" 1;
    "10.1.1.21:80" 1;
}

# Validate the browser's public origin before translating it for the daemon's
# loopback Host/Origin checks. Never replace arbitrary origins unconditionally.
map $http_origin $livolod_origin {
    default "invalid";
    "" "";
    "http://10.1.1.21" "http://127.0.0.1:8080";
    "http://10.1.1.21:80" "http://127.0.0.1:8080";
}

server {
    listen 10.1.1.21:80 default_server;
    server_name 10.1.1.21;
    server_tokens off;
    client_max_body_size 4k;

    if ($livolod_allowed_host = 0) { return 403; }
    if ($livolod_origin = "invalid") { return 403; }

    access_log /var/log/nginx/livolod-access.log;
    error_log /var/log/nginx/livolod-error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.0;
        proxy_set_header Host "127.0.0.1:8080";
        proxy_set_header Origin $livolod_origin;
        proxy_set_header Connection close;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_next_upstream off;
    }
}
