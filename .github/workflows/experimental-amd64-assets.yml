name: Publish experimental AMD64 supporting assets

on:
  push:
    branches: [main]
    paths: [host/docker/experimental-assets.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-amd64-assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: container-preview-0.6.0-amd64-81cf6fb
      SOURCE: 81cf6fb4628987cdd9ca2ec7637e1535d9feecbe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Test supporting asset generation offline
        run: PYTHONPATH=tools python -m unittest tools/test_experimental_assets.py -v
      - id: request
        run: |
          python - <<'PY'
          import json, os
          value = json.load(open('host/docker/experimental-assets.json'))
          assert set(value) == {'enabled'} and type(value['enabled']) is bool
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('enabled=' + str(value['enabled']).lower() + '\n')
          PY
      - if: steps.request.outputs.enabled == 'true'
        name: Build and verify fixed-source supporting assets
        run: |
          python tools/experimental_assets.py --output preview-assets
          (cd preview-assets && sha256sum --check SHA256SUMS)
      - if: steps.request.outputs.enabled == 'true'
        name: Publish experimental assets without replacing an existing release
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, urllib.error, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GH_REPO'] + '/releases/tags/' + os.environ['TAG']
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          try:
              with urllib.request.urlopen(request, timeout=30):
                  raise SystemExit('Release exists; refusing replacement')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit('Release lookup failed: HTTP ' + str(error.code))
          PY
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SOURCE"
          fi
          cat > notes.md <<'EOF'
          Supporting assets for the experimental Linux AMD64 HA companion container.
          This prerelease is not a stable Home Assistant integration or Supervisor app release.
          The integration files are built from frozen source 81cf6fb; this archive has
          normalized timestamps and its own checksum. No radio firmware is included.
          The source archive and pinned universal-silabs-flasher source accompany the preview.
          The container is published separately after its registry verification gates pass.
          EOF
          gh release create "$TAG" --target "$SOURCE" --draft --prerelease --latest=false \
            --title 'Experimental AMD64 container preview: supporting assets' --notes-file notes.md
          gh release upload "$TAG" preview-assets/*
          mkdir downloaded
          gh release download "$TAG" --dir downloaded
          (cd downloaded && sha256sum --check SHA256SUMS)
          diff preview-assets/SHA256SUMS downloaded/SHA256SUMS
          gh release edit "$TAG" --draft=false --prerelease --latest=false
          mkdir anonymous
          for asset in preview-assets/*; do
            name="$(basename "$asset")"
            curl --fail --location --proto '=https' --proto-redir '=https' \
              "https://github.com/$GH_REPO/releases/download/$TAG/$name" -o "anonymous/$name"
          done
          (cd anonymous && sha256sum --check SHA256SUMS)
          diff preview-assets/SHA256SUMS anonymous/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.request.outputs.enabled == 'true'
        with:
          name: experimental-amd64-supporting-assets
          path: preview-assets/
          if-no-files-found: error
