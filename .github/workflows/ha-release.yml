name: Publish Home Assistant releases

on:
  push:
    branches: [main]
    paths: [homeassistant/releases.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-release-publication
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        name: Read explicit release publication manifest
        run: |
          python - <<'PY'
          import json, os, re
          releases = json.load(open('homeassistant/releases.json'))
          assert releases and len({r['tag'] for r in releases}) == len(releases)
          assert sum(r['latest'] for r in releases) == 1
          for release in releases:
              assert set(release) == {'version', 'tag', 'commit', 'latest'}
              assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', release['version'])
              assert release['tag'] == 'ha-' + release['version']
              assert re.fullmatch(r'[0-9a-f]{40}', release['commit'])
              assert type(release['latest']) is bool
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('releases=' + json.dumps(releases) + '\n')
          PY
  release:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.releases) }}
    env:
      RELEASE_TAG: ${{ matrix.release.tag }}
      RELEASE_VERSION: ${{ matrix.release.version }}
      RELEASE_COMMIT: ${{ matrix.release.commit }}
      RELEASE_LATEST: ${{ matrix.release.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the immutable release tag
        run: test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.release.commit }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r tools/requirements-firmware-release.txt
      - name: Build and inspect clean source assets
        run: |
          python homeassistant/package_release.py --source release-source \
            --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --output release-assets
          cd release-assets
          sha256sum --check SHA256SUMS
      - name: Publish complete assets without replacing a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json; then
            if test "$(python -c 'import json; print(json.load(open("existing-release.json"))["isDraft"])')" = False; then
              echo "Release already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Livolo EC for Home Assistant $RELEASE_VERSION" \
              --notes-file "homeassistant/releases/$RELEASE_VERSION.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest="$RELEASE_LATEST"
