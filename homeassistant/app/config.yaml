name: Livolo EC
version: "0.2.0"
slug: livolo_ec
description: Dedicated Livolo EC radio service with a native Home Assistant API
url: https://github.com/psires/livolo_ec
arch:
  - aarch64
startup: services
boot: auto
init: false
uart: true
ingress: true
ingress_port: 8099
panel_icon: mdi:light-switch
panel_title: Livolo EC
panel_admin: true
ports:
  8090/tcp: null
ports_description:
  8090/tcp: Native authenticated API (leave unpublished on HA OS)
options:
  serial_port: ""
  serial_baudrate: 460800
  gateway: ""
  tag: ""
  api_token: ""
  ha_origin: http://homeassistant.local:8123
  output_mode: experimental_phase
schema:
  serial_port: device(subsystem=tty)
  serial_baudrate: list(115200|230400|460800|921600)
  gateway: match(^[0-9a-fA-F]{8}$)
  tag: match(^[0-9a-fA-F]{2}$)
  api_token: password
  ha_origin: url
  output_mode: list(disabled|experimental_phase)
