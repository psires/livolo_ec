[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "livolo-ec-client"
version = "0.1.0"
description = "Async client for the Livolo EC native API"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.11,<4"]

[tool.setuptools.packages.find]
include = ["livolo_ec_client*"]
